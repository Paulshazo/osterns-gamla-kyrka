<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Österns Gamla Kyrka">
  <defs>
    <pattern id="stone" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#9AA1A8"/>
      <rect x="0.4" y="0.4" width="4.4" height="3.2" rx="0.4" fill="#B0B6BC"/>
      <rect x="5.2" y="0.4" width="4.4" height="3.2" rx="0.4" fill="#A4ABB2"/>
      <rect x="-2" y="4.2" width="4.4" height="3.2" rx="0.4" fill="#A8AFB6"/>
      <rect x="2.8" y="4.2" width="4.4" height="3.2" rx="0.4" fill="#B4BAC0"/>
      <rect x="7.6" y="4.2" width="4.4" height="3.2" rx="0.4" fill="#9EA5AC"/>
    </pattern>
  </defs>

  <!-- Main building body -->
  <rect x="28" y="108" width="108" height="78" fill="url(#stone)" stroke="#6E757C" stroke-width="1.2"/>

  <!-- Side wing -->
  <rect x="128" y="128" width="48" height="58" fill="url(#stone)" stroke="#6E757C" stroke-width="1.2"/>

  <!-- Main roof -->
  <path d="M24 110 L82 58 L140 110 Z" fill="#2C3238"/>
  <!-- Wing roof -->
  <path d="M124 130 L152 96 L180 130 Z" fill="#2C3238"/>

  <!-- Spire base -->
  <rect x="76" y="48" width="12" height="14" rx="1" fill="#2C3238"/>
  <!-- Spire shaft -->
  <path d="M82 48 L84.2 8 L85.8 8 L88 48 Z" fill="#1A1F24"/>
  <!-- Spire tip / weather vane -->
  <line x1="85" y1="8" x2="85" y2="2" stroke="#1A1F24" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M85 3.5 L92 5.2 L85 6.6 Z" fill="#1A1F24"/>

  <!-- Main windows -->
  <g fill="#F7F8F9" stroke="#DDE1E5" stroke-width="0.6">
    <rect x="42" y="128" width="14" height="36" rx="1"/>
    <rect x="74" y="128" width="14" height="36" rx="1"/>
    <rect x="106" y="128" width="14" height="36" rx="1"/>
  </g>
  <!-- Window panes (main) -->
  <g stroke="#C5CCD2" stroke-width="0.7">
    <line x1="49" y1="128" x2="49" y2="164"/>
    <line x1="42" y1="140" x2="56" y2="140"/>
    <line x1="42" y1="152" x2="56" y2="152"/>
    <line x1="81" y1="128" x2="81" y2="164"/>
    <line x1="74" y1="140" x2="88" y2="140"/>
    <line x1="74" y1="152" x2="88" y2="152"/>
    <line x1="113" y1="128" x2="113" y2="164"/>
    <line x1="106" y1="140" x2="120" y2="140"/>
    <line x1="106" y1="152" x2="120" y2="152"/>
  </g>

  <!-- Wing windows -->
  <g fill="#F7F8F9" stroke="#DDE1E5" stroke-width="0.6">
    <rect x="138" y="142" width="11" height="28" rx="1"/>
    <rect x="154" y="142" width="11" height="28" rx="1"/>
  </g>
  <g stroke="#C5CCD2" stroke-width="0.7">
    <line x1="143.5" y1="142" x2="143.5" y2="170"/>
    <line x1="138" y1="151" x2="149" y2="151"/>
    <line x1="138" y1="160" x2="149" y2="160"/>
    <line x1="159.5" y1="142" x2="159.5" y2="170"/>
    <line x1="154" y1="151" x2="165" y2="151"/>
    <line x1="154" y1="160" x2="165" y2="160"/>
  </g>

  <!-- Foundation line -->
  <rect x="28" y="182" width="148" height="4" fill="#6E757C"/>
</svg>
